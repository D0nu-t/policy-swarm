[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyswarm"
version = "1.2.0"
description = "Agent-based modelling framework for opinion dynamics under AI governance interventions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Krishnasai Addala" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "networkx>=3.1",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Tier 0 named-entity extraction (keyword fallback works without it)
nlp = ["spacy>=3.7"]
# Tier 1: schema-driven LLM extraction (Ollama over HTTP, PDF ingestion)
llm = ["requests>=2.31", "pdfplumber>=0.10"]
# Tier 1 with a local HuggingFace model instead of Ollama
huggingface = ["policyswarm[llm]", "transformers>=4.40", "torch>=2.1", "accelerate>=0.27"]
# Tier 2: corpus-PCA embedding extraction
embedding = ["pdfplumber>=0.10", "sentence-transformers>=2.7", "scikit-learn>=1.4"]
# Suggest an opinion space from text (policyswarm/suggest.py)
topics = ["scikit-learn>=1.4"]                      # stage 1: NMF topics -> dimensions
decision = ["laya>=0.3.29"]                         # stage 2: Laya decision model -> keyword rules
# Local experiment dashboard (python -m policyswarm.gui)
gui = ["fastapi>=0.135", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "policyswarm[gui]"]

[project.scripts]
policyswarm = "policyswarm.cli:main"

[tool.setuptools.packages.find]
include = ["policyswarm*"]

[tool.setuptools.package-data]
policyswarm = ["schemas/*.yaml", "gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-experiment golden regression (minutes); deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
extend-exclude = ["policyswarm/tui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# The codebase aligns assignments and dict values in columns on purpose.
ignore = ["E203", "E221", "E222", "E241", "E251", "E272", "E501", "E701", "E702", "I001"]

[tool.ruff.lint.per-file-ignores]
# Re-exports; the optional tiers are added to __all__ dynamically.
"policyswarm/__init__.py" = ["F401"]
